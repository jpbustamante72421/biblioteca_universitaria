<!doctype html>
<html lang="es">
<head>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ titulo }} | Biblioteca Universitaria</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/biblioteca.css') }}">
</head>
<body class="biblio-body">
    <header class="biblio-navbar">
        <h1 class="biblio-brand">Biblioteca Universitaria</h1>
        <nav class="biblio-nav">
            <a class="biblio-nav-link" href="{{ url_for('home') }}">Inicio</a>
            <a class="biblio-nav-link" href="{{ url_for('catalogo') }}">Catálogo</a>
            <a class="biblio-nav-link" href="{{ url_for('servicios') }}">Servicios</a>
            <a class="biblio-nav-link" href="{{ url_for('contacto') }}">Contacto</a>
        </nav>
    </header>

    <main class="biblio-container">
        {% block content %}{% endblock %}
    </main>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>

    <!-- Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>

    <!-- Bootstrap 4.6 JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
</body>
</html>
