<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ titulo }} | Biblioteca Universitaria</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/biblioteca.css') }}">
</head>
<body class="biblio-body">
    <header class="biblio-navbar">
        <h1 class="biblio-brand">Biblioteca Universitaria</h1>
        <nav class="biblio-nav">
            <a class="biblio-nav-link" href="{{ url_for('home') }}">Inicio</a>
            <a class="biblio-nav-link" href="{{ url_for('catalogo') }}">Catálogo</a>
            <a class="biblio-nav-link" href="{{ url_for('servicios') }}">Servicios</a>
            <a class="biblio-nav-link" href="{{ url_for('contacto') }}">Contacto</a>
        </nav>
    </header>

    <main class="biblio-container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
